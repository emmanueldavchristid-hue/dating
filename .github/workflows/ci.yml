name: CI
on:
  push:
    branches: [main, mvp]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 16 + PostGIS + pgvector
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-16 postgresql-16-postgis-3 postgresql-16-pgvector
          sudo pg_ctlcluster 16 main start || sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER sortie WITH PASSWORD 'sortie' SUPERUSER;"
          sudo -u postgres psql -c "CREATE DATABASE sortie_test OWNER sortie;"
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic && ruff format --check app
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://sortie:sortie@localhost:5432/sortie_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test
      - run: npx expo export --platform android --output-dir /tmp/android-bundle
