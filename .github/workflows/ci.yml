name: CI
on:
  push:
    branches: [main, mvp]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: sortie, POSTGRES_PASSWORD: sortie, POSTGRES_DB: sortie_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sortie" --health-interval 5s --health-retries 20
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - name: Installer pgvector dans le conteneur PostGIS
        run: |
          docker exec ${{ job.services.postgres.id }} bash -c "apt-get update -qq && apt-get install -y -qq postgresql-16-pgvector"
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic && ruff format --check app
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://sortie:sortie@localhost:5432/sortie_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
