# Lancement local complet (PC de test) : voir docs/TESTER-SUR-TELEPHONE.md
#   docker compose up -d --build db api        (+ web si besoin de la console d'administration)
# Ports modifiables : DB_PORT, API_PORT, WEB_PORT (défauts 5433, 8000, 3000).
services:
  db:
    build: ./infra/db
    environment:
      POSTGRES_USER: sortie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sortie}
      POSTGRES_DB: sortie
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]  # accessible depuis le PC seulement ; 5433 évite un PostgreSQL déjà installé
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sortie -d sortie"]
      interval: 5s
      retries: 30

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sortie:${POSTGRES_PASSWORD:-sortie}@db:5432/sortie
      MEDIA_DIR: /app/media
    ports: ["${API_PORT:-8000}:8000"]
    volumes: [media:/app/media]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 5s
      retries: 30

  # Itinéraires tracés dans l'app (OSRM, auto-hébergé, sans quota). Données préparées une fois depuis l'extrait
  # OpenStreetMap par scripts/windows/demarrer-test.ps1, puis : docker compose --profile itineraires up -d osrm
  osrm:
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v5.27.1}
    profiles: ["itineraires"]
    command: osrm-routed --algorithm mld /data/ci.osrm
    volumes: ["${OSRM_DATA:-./infra/osrm/data}:/data"]
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [api]

volumes:
  dbdata:
  media:
