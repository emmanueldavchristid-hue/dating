# Lancement local complet (PC de test) : voir docs/TESTER-SUR-TELEPHONE.md
#   docker compose up -d --build db api        (+ web si besoin de la console d'administration)
# Ports modifiables : DB_PORT, API_PORT, WEB_PORT (défauts 5433, 8000, 3000).
services:
  db:
    build: ./infra/db
    environment:
      POSTGRES_USER: sortie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sortie}
      POSTGRES_DB: sortie
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]  # accessible depuis le PC seulement ; 5433 évite un PostgreSQL déjà installé
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sortie -d sortie"]
      interval: 5s
      retries: 30

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sortie:${POSTGRES_PASSWORD:-sortie}@db:5432/sortie
      MEDIA_DIR: /app/media
    ports: ["${API_PORT:-8000}:8000"]
    volumes: [media:/app/media]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 5s
      retries: 30

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [api]

volumes:
  dbdata:
  media:
