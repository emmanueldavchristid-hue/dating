# Lancement local complet : docker compose up --build
# Puis (une fois) : docker compose exec api python -m app.seed --demo
services:
  db:
    build: ./infra/db
    environment:
      POSTGRES_USER: sortie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sortie}
      POSTGRES_DB: sortie
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sortie -d sortie"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sortie:${POSTGRES_PASSWORD:-sortie}@db:5432/sortie
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  dbdata:
